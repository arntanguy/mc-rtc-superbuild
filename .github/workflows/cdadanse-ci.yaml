name: CDADance Demo (Devcontainer)

on:
  # Listen to a repository dispatch event by the name of `dispatch-event`
  # sent on push to CDADance's main branch
  repository_dispatch:
    types:
    - dispatch-cdadance
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  run:
    # runs-on: self-hosted-arnaud-xmg
    runs-on: [self-hosted, Linux] # ga-bigci.lirmm 
    strategy:
      fail-fast: false
      matrix:
        containerName: [cdadance-release]
        buildPreset: [cdadance-demo-auto, cdadance-demo-manual, cdadance-simu-auto, cdadance-simu-manual]

    steps:
    - name: Print runner name
      shell: bash
      run: |
          echo "Running on runner: ${{ runner.name }}"

    - name: Configure ssh-agent
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_KEY }}

    - name: Check ssh-agent
      shell: bash
      run: |
          ssh-add -l

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'latest'

    - name: Upgrade NPM
      shell: bash
      run: npm install -g npm@latest

    - name: Check NPM Version
      run: npm -v

    # - name: Install NVM
    #   shell: bash
    #   run: |
    #     curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
    #     export NVM_DIR="$HOME/.nvm"
    #     [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
    #     nvm install node
    #
    # - name: Verify NVM installation
    #   shell: bash
    #   run: |
    #     export NVM_DIR="$HOME/.nvm"
    #     [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
    #     nvm --version

    - name: Check docker
      shell: bash
      run: |
          docker ps

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Check release
      shell: bash
      run: |
        if [ -n "${{ github.event.client_payload.tag }}" ]; then
          echo "This is a release, using version tag ${{ github.event.client_payload.tag }}"
          echo "RELEASE_TAG=${{ github.event.client_payload.tag }}" >> $GITHUB_ENV
        else
          echo "This is not a release, using latest tag"
          echo "RELEASE_TAG=latest" >> $GITHUB_ENV
        fi

    #
    # - name: Free Disk Space (Ubuntu)
    #   if: ${{ runner.name }} != 'self-hosted-ci-arnaud-xmg'
    #   uses: jlumbroso/free-disk-space@main

    - name: 'Docker: Build Standalone Release'
      shell: bash
      run: |
        cat .github/devcontainer/${{ matrix.containerName }}/Dockerfile
        echo "SSH_AUTH_SOCK = ${{ env.SSH_AUTH_SOCK }}"
        CONTAINER_NAME=ghcr.io/isri-aist/cdadance
        CONTAINER_TAG=${{ matrix.buildPreset }}-standalone-$RELEASE_TAG
        echo "CONTAINER_NAME=${CONTAINER_NAME}" >> $GITHUB_ENV
        echo "CONTAINER_TAG=${CONTAINER_TAG}" >> $GITHUB_ENV

        docker build . -f .github/devcontainer/${{ matrix.containerName }}/Dockerfile --ssh default --tag ${CONTAINER_NAME}:${CONTAINER_TAG} --build-arg CMAKE_PRESET=${{ matrix.buildPreset }} --build-arg BUILD_VERSION=${BUILD_VERSION}
        docker push ${CONTAINER_NAME}:${CONTAINER_TAG}


    - name: "Devcontainer: Prepare Dockerfile for Devcontainer Release Version"
      shell: bash
      run: |
          echo "FROM ${CONTAINER_NAME}:${CONTAINER_TAG}" > .github/devcontainer/${{ matrix.containerName }}/Dockerfile
          cat .github/devcontainer/${{ matrix.containerName }}/Dockerfile

    # Publish cdadance docker images
    - name: "Devcontainer: Build Release Version (main branch of official repository)"
      if: github.ref == 'refs/heads/main' && github.repository == 'isri-aist/cdadance-superbuild'
      uses: devcontainers/ci@v0.3
      with:
        imageName: ghcr.io/isri-aist/cdadance
        imageTag: ${{ matrix.buildPreset }}-devcontainer-${{ env.RELEASE_TAG }}
        subFolder: .github/devcontainer/${{ matrix.containerName }}
        configFile: .github/devcontainer/${{ matrix.containerName }}/devcontainer.json
        push: always
